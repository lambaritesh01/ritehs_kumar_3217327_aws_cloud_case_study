AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NAGP foundation stack: VPC, subnets across two AZs, IGW, route tables, NACLs,
  security groups, private S3 bucket, VPC endpoints (S3 gateway, Secrets Manager
  and CloudWatch Logs interface), workload instance profiles, and the assignment
  IAM group/user. No NAT gateway. Deployed before the builder and application stacks.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Project }
        Parameters: [ProjectName, ArtifactBucketName]
      - Label: { default: Availability Zones }
        Parameters: [AvailabilityZoneA, AvailabilityZoneB]
      - Label: { default: S3 event wiring (set after the application stack exists) }
        Parameters: [UploadLambdaArn]

Parameters:
  ProjectName:
    Type: String
    Default: nagp
    Description: Short name used for tagging and resource names.
  ArtifactBucketName:
    Type: String
    Description: Globally unique S3 bucket name (generated outside the template).
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b
  UploadLambdaArn:
    Type: String
    Default: ''
    Description: >
      Business Lambda ARN for the uploads/ ObjectCreated notification. Leave empty
      on first deploy; set it via a stack update after the application stack exists.

Conditions:
  HasUploadLambdaArn: !Not [!Equals [!Ref UploadLambdaArn, '']]

Resources:

  # ------------------------------------------------------------------ Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-vpc' }
        - { Key: Project, Value: !Ref ProjectName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-igw' }

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-a' }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-b' }]

  PrivateAppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-app-a' }]

  PrivateAppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-app-b' }]

  PrivateDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.20.0/24
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-db-a' }]

  PrivateDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.21.0/24
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-db-b' }]

  # ------------------------------------------------------------- Route tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-rt-public' }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # Private route tables have NO default (0.0.0.0/0) route: no NAT, no internet.
  PrivateAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-rt-app' }]
  PrivateAppSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateAppSubnetA, RouteTableId: !Ref PrivateAppRouteTable }
  PrivateAppSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateAppSubnetB, RouteTableId: !Ref PrivateAppRouteTable }

  PrivateDbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-rt-db' }]
  PrivateDbSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateDbSubnetA, RouteTableId: !Ref PrivateDbRouteTable }
  PrivateDbSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateDbSubnetB, RouteTableId: !Ref PrivateDbRouteTable }

  # ------------------------------------------------------------------- NACLs
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-nacl-public' }]
  PublicNaclInHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 80, To: 80 } }
  PublicNaclInEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  PublicNaclOutApp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.10.0/24, PortRange: { From: 8000, To: 8000 } }
  PublicNaclOutAppB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.11.0/24, PortRange: { From: 8000, To: 8000 } }
  PublicNaclOutHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }
  PublicNaclOutHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 80, To: 80 } }
  PublicNaclOutEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 130, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  PublicSubnetANaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, NetworkAclId: !Ref PublicNacl }
  PublicSubnetBNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, NetworkAclId: !Ref PublicNacl }

  PrivateAppNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-nacl-app' }]
  # Inbound: ALB->app 8000, plus broad TCP+UDP ephemeral. The UDP ephemeral range is
  # required because VPC-attached Lambda ENIs use UDP (DNS to the VPC resolver) with
  # ephemeral source ports; a TCP-only ephemeral rule would break Lambda networking.
  PrivateAppNaclInAlbA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.20.0.0/24, PortRange: { From: 8000, To: 8000 } }
  PrivateAppNaclInAlbB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.20.1.0/24, PortRange: { From: 8000, To: 8000 } }
  PrivateAppNaclInTcpEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  PrivateAppNaclInUdpEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 120, Protocol: 17, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  PrivateAppNaclOutHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }
  PrivateAppNaclOutDbA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.20.0/24, PortRange: { From: 3306, To: 3306 } }
  PrivateAppNaclOutDbB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 111, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.21.0/24, PortRange: { From: 3306, To: 3306 } }
  PrivateAppNaclOutDnsTcp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.0.0/16, PortRange: { From: 53, To: 53 } }
  PrivateAppNaclOutDnsUdp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 121, Protocol: 17, RuleAction: allow, Egress: true, CidrBlock: 10.20.0.0/16, PortRange: { From: 53, To: 53 } }
  PrivateAppNaclOutTcpEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 130, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  PrivateAppNaclOutUdpEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateAppNacl, RuleNumber: 131, Protocol: 17, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  PrivateAppSubnetANaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateAppSubnetA, NetworkAclId: !Ref PrivateAppNacl }
  PrivateAppSubnetBNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateAppSubnetB, NetworkAclId: !Ref PrivateAppNacl }

  PrivateDbNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-nacl-db' }]
  PrivateDbNaclInMysqlA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateDbNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.20.10.0/24, PortRange: { From: 3306, To: 3306 } }
  PrivateDbNaclInMysqlB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateDbNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.20.11.0/24, PortRange: { From: 3306, To: 3306 } }
  PrivateDbNaclOutEphemeralA:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateDbNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.10.0/24, PortRange: { From: 1024, To: 65535 } }
  PrivateDbNaclOutEphemeralB:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateDbNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.11.0/24, PortRange: { From: 1024, To: 65535 } }
  PrivateDbSubnetANaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateDbSubnetA, NetworkAclId: !Ref PrivateDbNacl }
  PrivateDbSubnetBNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateDbSubnetB, NetworkAclId: !Ref PrivateDbNacl }

  # -------------------------------------------------------- Security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB; HTTP 80 from the internet.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Public HTTP }
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg-alb' }]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 app tier; only the ALB may reach 8000. No DB access.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS to S3 gateway and interface endpoints (no internet route exists) }
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg-app' }]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC Lambda; egress to RDS and AWS endpoints only. No inbound.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: 'HTTPS to S3 gateway and interface endpoints' }
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg-lambda' }]

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL; inbound 3306 only from the Lambda security group.
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg-rds' }]

  BuilderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Temporary AMI builder; zero inbound; outbound bootstrap only.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Package/artifact download (HTTPS) }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Package mirrors (HTTP) }
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg-builder' }]

  SecretsEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Secrets Manager interface endpoint; 443 from Lambda only.
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg-vpce-secrets' }]

  LogsEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudWatch Logs interface endpoint; 443 from workloads that log.
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg-vpce-logs' }]

  # Cross-SG rules as separate resources to avoid inter-SG circular dependencies.
  AlbEgressToApp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 8000, ToPort: 8000, DestinationSecurityGroupId: !Ref AppSecurityGroup, Description: ALB to app }
  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref AppSecurityGroup, IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: Only the ALB reaches the app }
  LambdaEgressToRds:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref LambdaSecurityGroup, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, DestinationSecurityGroupId: !Ref RdsSecurityGroup, Description: Lambda to RDS MySQL }
  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref RdsSecurityGroup, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref LambdaSecurityGroup, Description: RDS reachable ONLY from Lambda SG }
  SecretsEndpointIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref SecretsEndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref LambdaSecurityGroup, Description: Secrets endpoint from Lambda only }
  LogsEndpointIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref LogsEndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref LambdaSecurityGroup, Description: Logs endpoint from Lambda }
  LogsEndpointIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref LogsEndpointSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: Logs endpoint from app }

  # ------------------------------------------------------------------ S3
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Ref ArtifactBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      NotificationConfiguration:
        LambdaConfigurations: !If
          - HasUploadLambdaArn
          - - Event: 's3:ObjectCreated:*'
              Function: !Ref UploadLambdaArn
              Filter: { S3Key: { Rules: [{ Name: prefix, Value: uploads/ }] } }
          - !Ref AWS::NoValue
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  # ------------------------------------------------------------ VPC endpoints
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateAppRouteTable, !Ref PublicRouteTable]

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateAppSubnetA, !Ref PrivateAppSubnetB]
      SecurityGroupIds: [!Ref SecretsEndpointSecurityGroup]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateAppSubnetA, !Ref PrivateAppSubnetB]
      SecurityGroupIds: [!Ref LogsEndpointSecurityGroup]

  # ------------------------------------------------------ DB subnet group
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private DB subnets across both AZs.
      SubnetIds: [!Ref PrivateDbSubnetA, !Ref PrivateDbSubnetB]
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  # ------------------------------------------------------ Workload IAM roles
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: builder-artifact-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ['s3:GetObject'], Resource: !Sub '${ArtifactBucket.Arn}/artifacts/app/*' }
              - { Effect: Allow, Action: ['s3:GetBucketLocation'], Resource: !GetAtt ArtifactBucket.Arn }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  BuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref BuilderRole] }

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: app-uploads-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ['s3:PutObject'], Resource: !Sub '${ArtifactBucket.Arn}/uploads/*' }
              - { Effect: Allow, Action: ['s3:GetBucketLocation'], Resource: !GetAtt ArtifactBucket.Arn }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref AppRole] }

  # -------------------------------------------- Assignment IAM group + user
  # Demonstrates least-privilege IAM (read/observe project resources). This is NOT
  # the deployment identity. No access keys, no console password.
  DevelopersGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: nagp-developers
      Policies:
        - PolicyName: nagp-developer-readonly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # List/Describe/read APIs do not support resource-level ARNs and
              # require Resource: '*' (documented in SECURITY_DESIGN.md).
              - Sid: ProjectReadOnly
                Effect: Allow
                Action:
                  - 'ec2:Describe*'
                  - 'autoscaling:Describe*'
                  - 'elasticloadbalancing:Describe*'
                  - 'lambda:List*'
                  - 'lambda:Get*'
                  - 'rds:Describe*'
                  - 'cloudwatch:Describe*'
                  - 'cloudwatch:Get*'
                  - 'cloudwatch:List*'
                  - 'logs:Describe*'
                  - 'logs:Get*'
                  - 'logs:FilterLogEvents'
                  - 'cloudformation:Describe*'
                  - 'cloudformation:List*'
                  - 'cloudformation:Get*'
                  - 'secretsmanager:ListSecrets'
                  - 'secretsmanager:DescribeSecret'
                Resource: '*'
              - Sid: ProjectBucketRead
                Effect: Allow
                Action: ['s3:GetBucketLocation', 's3:ListBucket']
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ProjectArtifactObjects
                Effect: Allow
                Action: ['s3:GetObject']
                Resource: !Sub '${ArtifactBucket.Arn}/*'

  DeveloperUser:
    Type: AWS::IAM::User
    Properties:
      UserName: nagp-developer
      Groups: [!Ref DevelopersGroup]

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub '${AWS::StackName}-VpcId' }
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
    Export: { Name: !Sub '${AWS::StackName}-PublicSubnetAId' }
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
    Export: { Name: !Sub '${AWS::StackName}-PublicSubnetBId' }
  PrivateAppSubnetAId:
    Value: !Ref PrivateAppSubnetA
    Export: { Name: !Sub '${AWS::StackName}-PrivateAppSubnetAId' }
  PrivateAppSubnetBId:
    Value: !Ref PrivateAppSubnetB
    Export: { Name: !Sub '${AWS::StackName}-PrivateAppSubnetBId' }
  PrivateDbSubnetAId:
    Value: !Ref PrivateDbSubnetA
    Export: { Name: !Sub '${AWS::StackName}-PrivateDbSubnetAId' }
  PrivateDbSubnetBId:
    Value: !Ref PrivateDbSubnetB
    Export: { Name: !Sub '${AWS::StackName}-PrivateDbSubnetBId' }
  ArtifactBucketName:
